[project]
name = "lab3"
version = "0.1.0"
description = "NLP-Lab3"
readme = "README.md"
authors = [
    { name = "Jakub Gonczarek", email = "263999@students.pwr.edu.pl" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.2.0",
    "faiss-cpu>=1.16.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "langchain-core>=1.8.1",
    "langchain-openai>=1.8.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "openai>=3.52.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.23.0",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.2",
]

[[tool.mypy.overrides]]
# datasets ships no py.typed marker
module = "datasets.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# tqdm ships no py.typed marker
module = "tqdm.*"
ignore_missing_imports = true
